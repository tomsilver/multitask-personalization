<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistive Feeding Study - Redirecting</title>
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="refresh" content="0;url=meal-preferences.html">
  <script>
    // Redirect with any existing query parameters
    document.addEventListener('DOMContentLoaded', function() {
      const currentUrl = new URL(window.location.href);
      const searchParams = currentUrl.search;
      window.location.href = `meal-preferences.html${searchParams}`;
    });
  </script>
</head>
<body>
  <header>
    <h1>Assistive Feeding User Study</h1>
  </header>

  <main>
    <section>
      <h2>Redirecting...</h2>
      <p>Please wait while we redirect you to the updated meal page. If you are not redirected automatically, please <a href="meal-preferences.html">click here</a>.</p>
    </section>
  </main>
</body>
</html>
