# Config file when robot is mounted on vention stand

room_path:
  description: "Base path for the room"
  type: "path"
  values: "tv_world/body_2.obj"

table_path:
  description: "Base path for the table"
  type: "path"
  values: "tv_world/square_table.obj"

table_spawn_pose:
  description: "Position of the table in the room"
  type: "pose"
  values: [0.6, 0.45, -0.66, 0, 0, 0, 1]

spawn_tv:
  description: "Spawn the tv in the room"
  type: "bool"
  values: true

spawn_social:
  description: "Spawn a social partner in the room"
  type: "bool"
  values: true

social_base_pose:
  description: "Base pose of the social partner"
  type: "pose"
  values: [0.6, 1.0, -0.66, 0, 0, 0.7071068, 0.7071068]

robot_spawn_side:
  description: "Spawn side of the robot (true = right, false = left)"
  type: "bool"
  values: true

robot_holder_pose:
  description: "Pose of the robot holder"
  type: "pose"
  values: [0.0, 0.0, -0.34, 0, 0, 0, 1]

wheelchair_pose:
  description: "Pose of the wheelchair"
  type: "pose"
  values: [-0.2, 0.45, -0.06, 0, 0, 0, 1]

user_head_pose:
